<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIVE TV Premium Player</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins;
}

body{
background:#000;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:8px;
color:#fff;
}

/* PLAYER */
.player{
width:100%;
max-width:420px;
background:#0d0e13;
border-radius:16px;
padding:10px;
border:1px solid #1a1d2a;
overflow:hidden;
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:6px;
}

.header h2{
font-size:16px;
font-weight:600;
}

.header span{
color:#ff2e88;
}

/* TOGGLE */
.toggle-mode{
display:flex;
gap:2px;
background:#151722;
padding:2px;
border-radius:10px;
border:1px solid #202436;
}

.mode-btn{
font-size:9px;
padding:3px 8px;
border-radius:8px;
border:none;
cursor:pointer;
}

.mode-btn.active{
background:linear-gradient(90deg,#db117b,#8409e6);
color:#fff;
}

.mode-btn.inactive{
background:transparent;
color:#777;
}

/* SCREEN */
.screen{
width:100%;
aspect-ratio:16/9;
background:#000;
border-radius:12px;
overflow:hidden;
border:1px solid #222;
}

video{
width:100%;
height:100%;
object-fit:contain;
}

/* CONTROLS */
.controls{
display:flex;
justify-content:space-between;
margin-top:6px;
}

.btn{
width:34px;
height:34px;
border-radius:50%;
background:#1a1d2a;
border:none;
color:#fff;
cursor:pointer;
font-size:11px;
}

/* NOTICE */
.notice-live{
margin-top:6px;
background:#0b0d14;
border:1px solid #1c2133;
border-radius:10px;
padding:4px 6px;
display:flex;
align-items:center;
gap:6px;
font-size:11px;
color:#aaa;
overflow:hidden;
}

.notice-dot{
width:6px;
height:6px;
background:#ff2e88;
border-radius:50%;
box-shadow:0 0 6px #ff2e88;
}

/* GRID */
.grid{
margin-top:8px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:5px;
max-height:360px;
overflow-y:auto;
padding:2px;
}

/* CARD */
.card{
background:#121420;
border-radius:10px;
padding:6px;
text-align:center;
cursor:pointer;
position:relative;
border:1px solid #1e2233;
min-height:78px;
transition:.2s;
}

.card.active{
border:1px solid #ff2e88;
box-shadow:0 0 8px #ff2e8830;
}

/* LOGO SMALL */
.logo{
width:28px;
height:28px;
border-radius:50%;
background:#fff;
margin:auto;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
padding:2px;
}

.logo img{
width:100%;
height:100%;
object-fit:contain;
}

/* NAME */
.name{
font-size:8.5px;
margin-top:4px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

/* STAR */
.star{
position:absolute;
top:4px;
right:4px;
font-size:9px;
color:#ff2e88;
}
</style>
</head>

<body>

<div class="player">

<!-- HEADER -->
<div class="header">
<h2>LIVE <span>TV</span></h2>

<div class="toggle-mode">
<button class="mode-btn active">3D</button>
<button class="mode-btn inactive">2D</button>
</div>
</div>

<!-- SCREEN -->
<div class="screen">
<video id="video" autoplay muted controls></video>
</div>

<!-- CONTROLS -->
<div class="controls">
<button class="btn" onclick="prev()"><i class="fa fa-backward"></i></button>
<button class="btn" onclick="playPause()"><i class="fa fa-play"></i></button>
<button class="btn" onclick="next()"><i class="fa fa-forward"></i></button>
<button class="btn" onclick="mute()"><i class="fa fa-volume-xmark"></i></button>
</div>

<!-- NOTICE -->
<div class="notice-live">
<div class="notice-dot"></div>
<marquee>
🔴 LIVE TV | Premium Streaming Experience | ধন্যবাদ আমাদের সাথে থাকার জন্য | Smooth & High Quality Live Channels উপভোগ করুন
</marquee>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

</div>

<script>

const url="https://raw.githubusercontent.com/ahmedstore75/Iptvbdlive/main/mixiptvchannel.m3u";

let video=document.getElementById("video");
let grid=document.getElementById("grid");

let channels=[];
let index=0;
let hls=new Hls();

function load(){
fetch(url)
.then(r=>r.text())
.then(parse)
}

function parse(data){
let lines=data.split("\n");
let name="",logo="";

lines.forEach(l=>{
if(l.startsWith("#EXTINF")){
name=l.split(",")[1]||"Channel";
let m=l.match(/tvg-logo="(.*?)"/);
logo=m?m[1]:"https://cdn-icons-png.flaticon.com/512/716/716429.png";
}
else if(l.startsWith("http")){
channels.push({name,logo,url:l});
}
});

render();
play(0);
}

function render(){
grid.innerHTML="";
channels.forEach((c,i)=>{
let div=document.createElement("div");
div.className="card";
div.onclick=()=>play(i);
div.innerHTML=`
<div class="star"><i class="fa fa-star"></i></div>
<div class="logo"><img src="${c.logo}"></div>
<div class="name">${c.name}</div>
`;
grid.appendChild(div);
});
}

function play(i){
index=i;
let c=channels[i];

document.querySelectorAll(".card").forEach((e,idx)=>{
e.classList.toggle("active",idx===i);
});

if(Hls.isSupported()){
hls.destroy();
hls=new Hls();
hls.loadSource(c.url);
hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play());
}
else video.src=c.url;
}

function next(){ if(index<channels.length-1) play(index+1); }
function prev(){ if(index>0) play(index-1); }
function playPause(){ video.paused?video.play():video.pause(); }
function mute(){ video.muted=!video.muted; }

window.onload=load;

</script>

</body>
</html>
