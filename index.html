<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বাংলা টিভি - Premium Live Streaming</title>
    <!-- HLS.js for Live Streaming -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
        
        /* Original Dark Theme Variables */
        :root {
            --bg-base: #020617; 
            --bg-panel: rgba(15, 23, 42, 0.65); 
            --border-light: rgba(255, 255, 255, 0.08);
            --accent-red: #e11d48;
            --accent-red-glow: rgba(225, 29, 72, 0.4);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: radial-gradient(circle at 15% 50%, rgba(225, 29, 72, 0.03), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.04), transparent 25%);
        }

        /* ----- Header ----- */
        .premium-header {
            height: 70px;
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            padding: 0 30px;
            z-index: 50;
            flex-shrink: 0;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 24px;
            font-weight: 700;
        }

        .brand-logo i {
            color: var(--accent-red);
            font-size: 28px;
            filter: drop-shadow(0 0 8px var(--accent-red-glow));
        }

        .brand-logo span {
            color: var(--accent-red);
        }

        /* ----- Workspace Layout ----- */
        .app-workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* ----- Player Section ----- */
        .player-section {
            flex: 1.2; 
            display: flex;
            flex-direction: column;
            padding: 30px; 
            background-color: var(--bg-base);
            position: relative;
            justify-content: center; 
            align-items: center;
            z-index: 30;
        }

        .player-container {
            width: 100%;
            background: #000;
            border-radius: 16px;
            aspect-ratio: 16 / 9;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* স্ক্রিন ফিট করার জন্য ফিক্সড ভিডিও সিএসএস */
        video {
            width: 100% !important;
            height: 100% !important;
            max-width: 100%;
            max-height: 100%;
            /* 'fill' দিলে ভিডিওটি টেনে পুরো স্ক্রিনে ফিট হয়ে যাবে, কোনো কালো বর্ডার থাকবে না */
            object-fit: fill; 
            background: #000;
        }

        /* মোবাইল বা ফুলস্ক্রিন মোডে যাতে ব্রাউজার নিজে থেকে ভিডিও ফিট করে */
        video:fullscreen {
            object-fit: fill;
        }
        video:-webkit-full-screen {
            object-fit: fill;
        }

        .welcome-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(2, 6, 23, 0.95));
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        .welcome-overlay i {
            font-size: 60px;
            color: var(--accent-red);
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px var(--accent-red-glow));
        }

        .welcome-overlay h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .welcome-overlay p {
            color: var(--text-muted);
            font-size: 15px;
            max-width: 400px;
            text-align: center;
        }

        /* ----- Sidebar Section ----- */
        .sidebar-section {
            flex: 1; 
            background: var(--bg-panel);
            backdrop-filter: blur(16px);
            border-left: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        .sidebar-tools {
            padding: 16px;
            border-bottom: 1px solid var(--border-light);
            background: rgba(2, 6, 23, 0.4);
            display: flex;
            gap: 12px; 
            align-items: center;
            flex-shrink: 0; 
        }

        .filter-box { flex: 1; }
        .filter-box select {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 12px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
        }

        .search-box { flex: 1.2; position: relative; }
        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 13px;
        }

        .search-box input {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 12px 12px 38px;
            border-radius: 12px;
            color: white;
            font-size: 13px;
            outline: none;
        }

        /* Channels List */
        .channels-list {
            flex: 1;
            overflow-y: auto; 
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Channel Card Structure */
        .channel-card {
            display: flex;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .channel-card:hover {
            background: rgba(255, 255, 255, 0.07);
            transform: translateX(4px);
        }

        .channel-card.active-card {
            background: rgba(225, 29, 72, 0.12);
            border: 1px solid var(--accent-red);
        }

        /* Left-Side Logo Box */
        .card-logo {
            width: 48px;
            height: 48px;
            background: #090d16;
            border-radius: 10px;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.05);
            margin-right: 14px;
            flex-shrink: 0;
            position: relative;
        }

        .card-logo img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 6px;
            object-fit: contain;
            z-index: 2;
        }

        .card-logo i {
            position: absolute;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.15);
            z-index: 1;
        }

        /* Right-Side Text Info */
        .card-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex: 1;
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-category {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .status-msg {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            font-size: 14px;
            width: 100%;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        /* Responsive */
        @media (max-width: 950px) {
            .app-workspace { flex-direction: column; }
            .player-section { flex: none; padding: 12px; width: 100%; }
            .sidebar-section { width: 100%; flex: 1; border-left: none; border-top: 1px solid var(--border-light); }
            .channels-list { padding: 12px; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="premium-header">
        <div class="brand-logo">
            <i class="fas fa-play"></i> বাংলা<span>টিভি</span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="app-workspace">
        <section class="player-section">
            <div class="player-container">
                <div class="welcome-overlay" id="welcome-screen">
                    <i class="fas fa-satellite-dish"></i>
                    <h2>সরাসরি সম্প্রচার</h2>
                    <p>চ্যানেল তালিকা থেকে পছন্দের চ্যানেল নির্বাচন করুন।</p>
                </div>
                <video id="video-player" controls autoplay playsinline></video>
            </div>
        </section>

        <aside class="sidebar-section">
            <div class="sidebar-tools">
                <div class="filter-box">
                    <select id="category-dropdown">
                        <option value="all">সব ক্যাটাগরি</option>
                    </select>
                </div>
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="খুঁজুন...">
                </div>
            </div>

            <!-- Channels Row List Container -->
            <div class="channels-list" id="channels-list">
                <div class="status-msg" id="loading-msg">
                    <i class="fas fa-circle-notch fa-spin" style="font-size: 26px; color: var(--accent-red); margin-bottom: 12px;"></i>
                    <p>চ্যানেল লোড হচ্ছে, অনুগ্রহ করে অপেক্ষা করুন...</p>
                </div>
            </div>
        </aside>
    </main>

    <script>
        const M3U_URL = "https://raw.githubusercontent.com/ahmedstore75/Iptvbdlive/main/mixiptvchannel.m3u";

        let allChannels = [];
        let uniqueCategories = new Set();
        let hlsPlayer = null;

        const playerEl = document.getElementById('video-player');
        const welcomeScreen = document.getElementById('welcome-screen');
        const listContainer = document.getElementById('channels-list');
        const searchInput = document.getElementById('search-input');
        const categoryDropdown = document.getElementById('category-dropdown');

        searchInput.addEventListener('input', renderChannels);
        categoryDropdown.addEventListener('change', renderChannels);

        categoryDropdown.addEventListener('change', () => {
            searchInput.value = '';
        });

        async function fetchPlaylist() {
            let loaded = false;

            try {
                const response = await fetch(M3U_URL);
                if (response.ok) {
                    const data = await response.text();
                    loaded = parseM3U(data);
                }
            } catch (e) {}

            if (!loaded) {
                try {
                    const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(M3U_URL)}`);
                    if (res.ok) {
                        const json = await res.json();
                        loaded = parseM3U(json.contents);
                    }
                } catch (e) {}
            }

            if (!loaded) {
                try {
                    const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(M3U_URL)}`);
                    if (res.ok) {
                        const data = await res.text();
                        loaded = parseM3U(data);
                    }
                } catch (e) {}
            }

            if (!loaded) {
                listContainer.innerHTML = `
                    <div class="status-msg" style="color:var(--accent-red);">
                        <i class="fas fa-exclamation-triangle" style="font-size:26px; margin-bottom:10px;"></i>
                        <p><b>চ্যানেল ডাটা পাওয়া যায়নি!</b></p>
                    </div>`;
            }
        }

        function parseM3U(text) {
            if (!text || !text.includes("#EXTM3U")) return false;
            
            allChannels = [];
            uniqueCategories.clear();
            
            const lines = text.split(/\r?\n/);
            let currentItem = null;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                
                if (line.startsWith('#EXTINF:')) {
                    currentItem = {};
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);
                    currentItem.logo = logoMatch ? logoMatch[1] : '';
                    
                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    currentItem.category = groupMatch ? groupMatch[1] : 'LIVE TV';
                    uniqueCategories.add(currentItem.category);
                    
                    const commaIndex = line.lastIndexOf(',');
                    currentItem.title = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : 'Unknown Channel';
                } 
                else if (line.startsWith('http') && currentItem) {
                    currentItem.url = line;
                    allChannels.push(currentItem);
                    currentItem = null; 
                }
            }

            if(allChannels.length === 0) return false;

            categoryDropdown.innerHTML = '<option value="all">সব ক্যাটাগরি</option>';
            Array.from(uniqueCategories).sort().forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                option.textContent = cat;
                categoryDropdown.appendChild(option);
            });

            renderChannels();
            return true;
        }

        function renderChannels() {
            const query = searchInput.value.toLowerCase().trim();
            const filterCat = categoryDropdown.value;
            listContainer.innerHTML = '';

            const results = allChannels.filter(ch => {
                const titleMatch = ch.title.toLowerCase().includes(query);
                if (query.length > 0) {
                    return titleMatch;
                }
                const catMatch = filterCat === 'all' || ch.category === filterCat;
                return titleMatch && catMatch;
            });

            if (results.length === 0) {
                listContainer.innerHTML = `<div class="status-msg">কোনো চ্যানেল পাওয়া যায়নি!</div>`;
                return;
            }

            results.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'channel-card';

                card.innerHTML = `
                    <div class="card-logo">
                        <i class="fas fa-tv"></i>
                        ${ch.logo ? `<img src="${ch.logo}" onerror="this.style.display='none'" alt="logo">` : ''}
                    </div>
                    <div class="card-info">
                        <span class="card-title">${ch.title}</span>
                        <span class="card-category">${ch.category}</span>
                    </div>
                `;

                card.addEventListener('click', () => {
                    document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active-card'));
                    card.classList.add('active-card');
                    launchStream(ch);
                });

                listContainer.appendChild(card);
            });
        }

        function launchStream(channel) {
            welcomeScreen.style.opacity = '0';
            setTimeout(() => { welcomeScreen.style.display = 'none'; }, 400);

            if (Hls.isSupported()) {
                if (hlsPlayer) { hlsPlayer.destroy(); }
                hlsPlayer = new Hls({ enableWorker: true, lowLatencyMode: true });
                hlsPlayer.loadSource(channel.url);
                hlsPlayer.attachMedia(playerEl);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    playerEl.play().catch(e => console.log(e));
                });
            } else if (playerEl.canPlayType('application/vnd.apple.mpegurl')) {
                playerEl.src = channel.url;
                playerEl.addEventListener('loadedmetadata', () => {
                    playerEl.play().catch(e => console.log(e));
                });
            }
        }

        window.addEventListener('DOMContentLoaded', fetchPlaylist);
    </script>
</body>
</html>
