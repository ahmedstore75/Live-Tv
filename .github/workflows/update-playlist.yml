name: Auto Fetch IPTV Data

on:
  schedule:
    # প্রতিদিন রাত ১২টায় অটোমেটিক রান হবে (UTC সময়)
    - cron: '0 0 * * *'
  # GitHub থেকে ম্যানুয়ালি রান করার জন্য
  workflow_dispatch:

# গিটহাবে ফাইল পুশ করার অনুমতি (403 Error ঠিক করার জন্য)
permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Data from Worker API
        run: |
          # VLC/Mozilla User-Agent সহ Worker লিঙ্ক থেকে ডাটা সেভ করবে
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" "https://saiptvlive.ahmed-bd-org.workers.dev/102.m3u8" -o playlist.m3u8

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u8
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update IPTV playlist" && git push)
