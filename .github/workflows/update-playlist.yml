name: Auto Fetch IPTV Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch Data Direct
        run: |
          curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) VLC/3.0.18" "http://filex.me:8080/live/3114654477/5787654467/102.m3u8" -o playlist.m3u8

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u8
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update IPTV playlist" && git push)
